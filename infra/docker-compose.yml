services:
  api:
    build:
      context: ../services/api
      dockerfile: ../infra/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../services/api:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: upgradeatlas
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../apps/web:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: upgradeatlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  pgdata:
