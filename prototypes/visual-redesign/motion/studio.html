<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UpgradeAtlas — Studio Laptop Render Harness</title>
<style>
  :root{--bg:#0a0b0d;--fg:#f2f4f7;--muted:#8b95a3;--signal:#e5484d}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;font-size:13px}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #30353d}
  h1{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0}
  main{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px}
  aside{display:flex;flex-direction:column;gap:8px}
  button{background:#1a1e24;color:var(--fg);border:1px solid #30353d;border-radius:4px;padding:6px 10px;cursor:pointer;font-size:12px;transition:background 120ms ease-out,border-color 120ms ease-out}
  button:hover{background:#232830;border-color:var(--signal)}button.active{background:var(--signal);border-color:var(--signal);color:#0a0b0d}
  .hint{font-size:11px;color:var(--muted);padding:8px;border-radius:4px;background:#14171c;line-height:1.5}
  #viewport{position:relative;background:#0a0b0d;border:1px solid #30353d;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:70vh}
  #meta{position:absolute;bottom:8px;left:8px;font-size:11px;color:var(--muted);pointer-events:none}
  #meta.ok{color:var(--signal)}
  #output{margin-top:8px;font-size:11px;word-break:break-all}
</style>
</head>
<body>
<header><h1>UpgradeAtlas — Studio Laptop Render Harness</h1>
  <span class="hint">Labelled concept visual. ORIGINAL procedural assets. No stock, no SHAGA copy.</span></header>
<main>
  <aside>
    <div class="view-btns" id="views"></div>
    <hr style="border-color:#30353d;margin:8px 0">
    <button id="renderBtn">Render current</button>
    <button id="batchBtn">Batch render all → window.__renders</button>
    <div id="output"></div>
  </aside>
  <div id="viewport"><canvas id="c"></canvas><div id="meta"></div></div>
</main>
<script type="module">
import { buildStudio } from '/motion/studio.js'
const canvas=document.getElementById('c')
const meta=document.getElementById('meta')
const out=document.getElementById('output')
const viewsDiv=document.getElementById('views')
let studio=null,activePreset='hero-desktop'
const DPR=1
const DIMS={'hero-desktop':[1920,1080],'hero-mobile':[1080,1920],
  'catalog-front':[1920,1080],'catalog-top':[1920,1080],'catalog-detail':[1920,1080]}
async function renderPreset(preset){
  if(!studio)return null
  const[w,h]=DIMS[preset]
  studio.camera=studio.applyPreset(preset)
  studio.camera.aspect=w/h
  studio.camera.updateProjectionMatrix()
  studio.renderer.setSize(w,h)
  studio.renderer.render(studio.scene,studio.camera)
  return canvas.toDataURL('image/webp',0.92)
}
async function init(){
  if(studio)studio.renderer.dispose()
  const[w,h]=DIMS['hero-desktop']
  studio=buildStudio({canvas,width:w,height:h,dpr:DPR})
  meta.textContent='studio ready';meta.className='ok'
  Object.keys(studio.presets).forEach(k=>{
    const b=document.createElement('button');b.textContent=k;b.dataset.preset=k
    b.onclick=async()=>{
      viewsDiv.querySelectorAll('button').forEach(x=>x.classList.remove('active'))
      b.classList.add('active');activePreset=k
      const data=await renderPreset(k)
      out.textContent=data?`${k} ✓ (${studio.camera.position.toArray().map(v=>+v.toFixed(1)).join(',')})`:'FAIL'
    }
    viewsDiv.appendChild(b)
  })
  viewsDiv.firstChild?.click?.()
  document.getElementById('renderBtn').onclick=()=>renderPreset(activePreset).then(d=>out.textContent=d?'✓':'FAIL')
  document.getElementById('batchBtn').onclick=async()=>{
    out.textContent='Batch rendering…'
    const results={}
    for(const key of Object.keys(studio.presets)){
      const data=await renderPreset(key)
      if(data){results[key]=data;out.textContent+=`\n${key} ✓`}else out.textContent+=`\n${key} FAIL`
      await new Promise(r=>setTimeout(r,200))
    }
    window.__renders=results
    out.textContent+='\nDone — window.__renders has '+Object.keys(results).length+' keys'
  }
}
init()
</script>
</body>
</html>
